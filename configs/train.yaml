# 生产训练入口唯一运行配置。模型架构由 --nemo，时间戳/规范化由 vocab_spec.json 管理；
# 分段参数属于上游清单生成器，不在这里伪装成训练期开关。
tokenizer: {vocab: 8000, spm_alpha: 0.25}
data:
  # R-S11.2【不变量】:DBD 已裁,份额并入主线;与 rubato/model/sampling.DIALECT_MIX 一致
  mix: {A2S: 0.35, A2S_lite: 0.15, TAST: 0.20, AMT: 0.30}
  # 16GB Windows 实测 100–150s OOM；60s 是当前安全生产值。CLI 可显式覆盖。
  max_duration_per_batch_sec: 60
optim:
  name: adamw
  lr_decoder: 5.0e-4
  lr_encoder: 1.0e-4                    # 热启动:encoder 降载微调
  betas: [0.9, 0.98]
  wd: 0.01
  warmup_steps: 1500
  schedule: cosine
  min_lr_ratio: 0.1
  clip_norm: 1.0
  grad_accum_to_audio_sec: 2000        # 有效 batch 以音频秒计
max_steps: 100000
max_epochs: 1000
precision: bf16
# Windows/WDDM 16GB 卡的生产显存策略。变长音频 batch 会产生相邻但不同大小的
# allocation；expandable segments 用可增长段降低碎片。运行时每 200 optimizer step
# 在无活跃计算图的安全边界记录水位，仅在低余量且确有可回收 cache 时释放。
memory:
  allocator_conf: expandable_segments:True
  check_every_steps: 200
  min_free_mb: 1024
  min_reclaimable_mb: 512
  cleanup_after_eval: true
loss:
  len_weight_pow: 0.5                   # 1/sqrt(|T|)
  sem_label_smooth: 0.1
  ts_smooth: {p_center: 0.9, w: 5}      # 时间戳序数平滑核
  pitch_weight: 1.0
specaugment: false                     # 论文未提;真实录音掉分再开
eval:
  every_steps: 1000
  decode_every_steps: 0
  max_samples_per_source: 48
ckpt:
  keep: 6
  save_every_steps: 200
  select_by: text_ned_proxy
seed: 20260706
