# 音源清单 — 6 源池,全 sfizz 引擎。
# 权重依据: Salamander 是唯一已知力度层≥10 且 sfizz 兼容无误的主力;
# Splendid / ExperienceNY 提供互补音色(明亮 vs. 中性大琴);
# Kamoepiano 作为少量离群音色注入,避免音源过拟合。
# 权重按 SPEC R-S4.2 分配,后续可根据消融实验调节。
sources:
  S1_salamander:
    engine: sfizz
    ratio: 0.40
    license: CC-BY-3.0
    path: assets/soundfonts/SalamanderGrandPiano/Salamander Grand Piano V3.sfz
    note: 主力音源,力度层完整,pp-ff 动态 28.7 dB,sfizz 零报错
    url: https://github.com/sfzinstruments/SalamanderGrandPiano
  S2_splendid:
    engine: sfizz
    ratio: 0.25
    license: Public Domain
    path: assets/soundfonts/SplendidGrandPiano/Splendid Grand Piano.sfz
    note: 146 MB 轻量,Grotrian 音色明亮,与 Salamander 互补
    url: https://github.com/sfzinstruments/SplendidGrandPiano
  S3_experience_ny:
    engine: sfizz
    ratio: 0.25
    license: free
    path: assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B ORTF Hammers V1.0.sfz
    variants:
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B AB Omni V1.0.sfz
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B Ambisonic Down V1.0.sfz
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B Ambisonic Level V1.0.sfz
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B Ambisonic Up V1.0.sfz
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B Cardioid V1.0.sfz
      - assets/soundfonts/TheExperienceNY/The Experience NY S&S Model B ORTF Hammers V1.0.sfz
    note: 6.5 GB Steinway Model B,6 组话筒位;渲染时确定性随机选一变体,1 源 6 变体不重复计数
  S4_kamoepiano:
    engine: sfizz
    ratio: 0.10
    license: free
    path: assets/soundfonts/Kamoepiano/kamoepiano301/kamoepiano301.sfz
    note: 212 MB,音色偏暗,少量注入增加音源多样性
    url: VERIFY
  S5_abchase5:
    engine: sfizz
    ratio: 0.10
    license: free
    path: assets/soundfonts/ABChase5/ABChase_stretch-tuned.sfz
    variants:
      - assets/soundfonts/ABChase5/ABChase_stretch-tuned.sfz
      - assets/soundfonts/ABChase5/ABChase_untuned.sfz
    note: stretch-tuned / untuned 双变体,音色现代,与 Salamander 互补
  S6_softify:
    engine: sfizz
    ratio: 0.10
    license: free
    path: assets/soundfonts/SoftifyPiano/SFZ/Softify Piano Vol 1 V1.1.sfz
    note: 1.8 GB 高品质钢琴, SE8 ORTF 话筒位
    url: https://www.softifymusic.com/
render:
  sr_render: 44100
  sr_target: 16000
  opus_bitrate: 64k
  fluidsynth_gain: 0.7
  silence_gate_db: -60
  timeout_s: 600          # 单曲渲染超时(秒)。Salamander 慢渲不再挂死管线,超时记 failures
  # sfizz_render 附加 flag(以本机 sfizz_render --help 为准,不识别的请删):
  #   --polyphony 96 : 限制最大发声数。Salamander V3(kinwie 版)每个 note-off 会触发
  #                    弦共鸣/击槌噪声 release 采样、踏板事件触发踏板噪声采样,加上
  #                    note_polyphony=1 的抢音,声部数爆炸是慢渲主因之一
  #   --use-eot      : 以 MIDI end-of-track 为渲染终点(生成 MIDI 时在末音后留 2-3s 静音,
  #                    否则收尾混响被截)。防止长释放采样把渲染拖到天荒地老
  #   --quality 2    : 重采样质量(默认 2;调 1 提速,音质略降)
  sfizz_flags: ["--polyphony", "96", "--use-eot", "--quality", "2"]
